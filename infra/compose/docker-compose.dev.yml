# Local development stack. Development credentials only; never reuse them outside a developer machine.
# Usage (from the repo root): docker compose -f infra/compose/docker-compose.dev.yml up --build
name: xplovoice
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres-dev-only
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xplovoice"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  migrate:
    build: ../../apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      XV_ENVIRONMENT: development
      XV_MIGRATION_DATABASE_URL: postgresql+psycopg://xplovoice_owner:xplovoice_owner@postgres:5432/xplovoice
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ../../apps/api
    env_file: ../../apps/api/.env.example
    environment:
      XV_DATABASE_URL: postgresql+psycopg://xplovoice_app:xplovoice_app@postgres:5432/xplovoice
      XV_REDIS_URL: redis://redis:6379/0
      XV_LIVEKIT_URL: ws://localhost:7880           # what the browser uses
      XV_LIVEKIT_INTERNAL_URL: ws://127.0.0.1:7880  # what the worker uses (it shares LiveKit's network)
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Phase 3: LiveKit carries browser (and later SIP) audio. ADR-0006.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  # Voice worker: same image as the API, different process. It shares LiveKit's network namespace so the
  # media address LiveKit advertises (127.0.0.1) is reachable from both the browser and the worker.
  voice-worker:
    build: ../../apps/api
    command: ["python", "-m", "xplovoice_worker"]
    network_mode: "service:livekit"
    environment:
      XV_ENVIRONMENT: development
      XV_REDIS_URL: redis://redis:6379/0
      XV_INTERNAL_API_URL: http://api:8000
      XV_WORKER_KEY: dev-only-worker-key
    # The API image's health check probes :8000/healthz, which the worker does not serve. Probe the worker's
    # own metrics endpoint instead (127.0.0.1:9100, shared network namespace with livekit).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9100/metrics')"]
      interval: 15s
      timeout: 3s
    depends_on:
      api: { condition: service_started }
      livekit: { condition: service_started }

  web:
    build:
      context: ../../apps/web
      args:
        XV_LIVEKIT_PUBLIC_URL: ws://localhost:7880
    environment:
      XV_API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
