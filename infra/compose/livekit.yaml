# Local LiveKit server for development only. Development key pair; never reuse it outside a developer machine.
# Media uses one TCP and one UDP port so it works through Docker port mapping on Windows and macOS.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1   # browsers on this machine reach media at localhost
keys:
  devkey: dev-only-livekit-secret-change-me-0123456789
logging:
  level: info
room:
  empty_timeout: 60
